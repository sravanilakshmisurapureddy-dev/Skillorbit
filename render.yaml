services:
  - type: web
    name: campus2career-ai
    env: python
    region: singapore  # Closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        value: campus2career_super_secret_hackathon_key_2025
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: campus2career-db
      mountPath: /data
      sizeGB: 1
