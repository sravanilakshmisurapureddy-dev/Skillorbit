[build]
  command = "pip install -r requirements.txt && python build_netlify.py"
  functions = "netlify/functions"
  publish = "static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[build.environment]
  PYTHON_VERSION = "3.11"
  NETLIFY = "true"
