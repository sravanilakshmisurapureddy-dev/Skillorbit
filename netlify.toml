[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "static"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[build.environment]
  PYTHON_VERSION = "3.11"
  NETLIFY = "true"
